name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Збірка APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Перейменування
        run: cp android/app/build/outputs/apk/release/app-release.apk postanovy-205-1009.apk

      - uses: actions/upload-artifact@v4
        with:
          name: postanovy-205-1009-apk
          path: postanovy-205-1009.apk

      - name: Публікація в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" postanovy-205-1009.apk \
            --title "Android APK 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Збірка з коміту ${GITHUB_SHA::7}. Встановлення: завантажте postanovy-205-1009.apk на телефон і відкрийте його." \
            --latest
