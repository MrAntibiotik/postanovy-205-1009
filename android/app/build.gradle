plugins {
    id 'com.android.application'
}

// index.html — єдине джерело: беремо його з кореня репозиторію (той самий файл, що й на GitHub Pages)
def syncSite = tasks.register('syncSite', Copy) {
    from(rootProject.file('../index.html'))
    into(layout.projectDirectory.dir('src/main/assets'))
}
preBuild.dependsOn(syncSite)

android {
    namespace 'ua.mrantibiotik.postanovy'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.mrantibiotik.postanovy'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'postanovy'
            keyAlias 'postanovy'
            keyPassword 'postanovy'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
