<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Постанови № 205 і № 1009 — навчальний інструмент</title>
<style>
:root{
  --bg:#F3F6F9;--surface:#FFFFFF;--ink:#13202E;--muted:#5A6B7D;--line:#D5DCE4;
  --bar:#0E2A47;--bar-ink:#FFFFFF;--accent:#0E2A47;--signal:#D9480F;--signal-soft:#FDEBDD;
  --ok:#1F7A4F;--ok-soft:#DDF1E6;--bad:#B42318;--bad-soft:#FBE3E1;
  --display:"Bahnschrift","DIN Alternate","DIN Next","Roboto Condensed","Arial Narrow",sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1520;--surface:#122030;--ink:#E5ECF4;--muted:#93A4B6;--line:#24384D;
    --bar:#0F2338;--bar-ink:#E5ECF4;--accent:#9CC3EA;--signal:#FF8A3D;--signal-soft:#3A2414;
    --ok:#4CC38A;--ok-soft:#12321F;--bad:#FF6B5E;--bad-soft:#3A1715;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1520;--surface:#122030;--ink:#E5ECF4;--muted:#93A4B6;--line:#24384D;
  --bar:#0F2338;--bar-ink:#E5ECF4;--accent:#9CC3EA;--signal:#FF8A3D;--signal-soft:#3A2414;
  --ok:#4CC38A;--ok-soft:#12321F;--bad:#FF6B5E;--bad-soft:#3A1715;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--text)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:.01em}
h1{font-size:1.9rem;margin:.2em 0 .4em}
h2{font-size:1.35rem;margin:1.6em 0 .5em}
h3{font-size:1.1rem;margin:1.2em 0 .4em}
p,li{max-width:72ch}
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem}
.brand{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--bar-ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--signal);font-weight:600}
.search{flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;padding:.45rem .7rem;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,.12);color:var(--bar-ink);font:inherit}
.search input::placeholder{color:rgba(229,236,244,.7)}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--bar-ink);border-radius:6px;padding:.35rem .6rem;font-size:.85rem}
.app{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);padding:1rem .75rem;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;background:var(--surface)}
.side h4{font-family:var(--display);font-size:.8rem;color:var(--muted);margin:1rem .5rem .3rem;font-weight:600}
.side a{display:flex;gap:.5rem;align-items:center;padding:.35rem .5rem;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.93rem}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--signal-soft);color:var(--ink);font-weight:600}
.side a.off{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.half{border-color:var(--signal);background:linear-gradient(90deg,var(--signal) 50%,transparent 50%)}
.dot.full{border-color:var(--ok);background:var(--ok)}
main{padding:1.5rem clamp(1rem,4vw,3rem) 6rem;min-width:0}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding:.2rem .7rem;margin:0 0 1.2rem;max-width:72ch}
.rail{margin:1.5rem 0 2rem;overflow-x:auto;padding-bottom:.5rem}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));min-width:660px;position:relative}
.rail ol::before{content:"";position:absolute;left:0;right:0;top:15px;height:6px;background:var(--accent);border-radius:3px}
.rail li{position:relative;padding-top:34px;max-width:none}
.rail .node{position:absolute;top:4px;left:0;width:28px;height:28px;border-radius:50%;background:var(--surface);border:5px solid var(--signal)}
.rail li.done .node{background:var(--ok);border-color:var(--ok)}
.rail .st{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.2;padding-right:.5rem}
.rail .bl{font-size:.82rem;color:var(--muted)}
.blocks{list-style:none;padding:0;margin:0;display:grid;gap:.6rem;max-width:760px}
.blocks li{max-width:none}
.blk{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.8rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem 1rem;text-decoration:none;color:var(--ink)}
.blk .n{font-family:var(--display);font-size:1.6rem;font-weight:600;color:var(--signal);text-align:center}
.blk .t{font-weight:600}
.blk .s{font-size:.85rem;color:var(--muted)}
.blk.locked{opacity:.55;pointer-events:none}
.pill{font-size:.78rem;padding:.15rem .55rem;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--signal-soft);color:var(--signal)}
.ref{display:inline-block;font-size:.78rem;font-weight:600;color:var(--signal);border:1px solid var(--signal);border-radius:4px;padding:0 .35rem;margin-left:.3rem;vertical-align:1px;white-space:nowrap}
.box{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--signal);border-radius:6px;padding:.8rem 1rem;margin:1.2rem 0;max-width:72ch}
.box h3{margin-top:0}
.box.info{border-left-color:var(--accent)}
.tablewrap{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{font-family:var(--display);font-weight:600;background:var(--bg)}
td.c{text-align:center;font-weight:600}
td.c.v{color:var(--signal)}
td.c.p{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.5rem 0}
.btn{border:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:6px;padding:.5rem 1rem;font-weight:600;text-decoration:none;display:inline-block}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.quiz{max-width:720px}
.qmeta{color:var(--muted);font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:.4rem 0 1rem}
.bar i{display:block;height:100%;background:var(--signal)}
.q{font-size:1.1rem;font-weight:600;margin:.6rem 0 1rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:.7rem .9rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:1rem;padding:.8rem 1rem;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.fb.ok{border-left:5px solid var(--ok)}
.fb.no{border-left:5px solid var(--bad)}
.gl{display:grid;gap:.1rem;max-width:820px}
.gl dt{font-weight:700;margin-top:.8rem}
.gl dd{margin:0;color:var(--ink)}
.gl dd .ref{margin-left:.2rem}
.filter{width:100%;max-width:420px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;margin:.5rem 0 1rem}
.res{list-style:none;padding:0;max-width:760px}
.res li{padding:.6rem 0;border-bottom:1px solid var(--line);max-width:none}
.res a{font-weight:600}
.res small{display:block;color:var(--muted)}
mark{background:var(--signal-soft);color:inherit;padding:0 .1em}
.bottom{display:none}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:6px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.steps{padding-left:1.3rem}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .search{max-width:none}
  .brand span{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .bottom a{display:flex;flex-direction:column;align-items:center;padding:.45rem 0 .55rem;font-size:.72rem;text-decoration:none;color:var(--muted)}
  .bottom a.on{color:var(--signal);font-weight:700}
  .bottom svg{width:22px;height:22px;margin-bottom:2px}
  h1{font-size:1.55rem}
  .rail{overflow:visible}
  .rail ol{grid-template-columns:1fr;min-width:0;gap:.9rem;padding-left:.2rem}
  .rail ol::before{left:11px;right:auto;top:6px;bottom:6px;width:6px;height:auto}
  .rail li{padding:0 0 0 2.6rem;min-height:28px}
  .rail .node{top:0;left:0}
  .iconbtn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.topbar,.side,.bottom,.btns{display:none}.app{display:block}}
</style>
</head>

<script>
/* ===================== ДАНІ ===================== */
const EDITION = "Редакція станом на 13.08.2026 (зі змінами, внесеними постановою № 1009). Навчальний посібник, не офіційний текст — звіряйте з zakon.rada.gov.ua.";

const STAGES = [
  {name:"Ініціювання", block:3},
  {name:"Проектування", block:4},
  {name:"Створення та впровадження", block:5},
  {name:"Промислова експлуатація", block:6},
  {name:"Виведення з експлуатації", block:7}
];

const BLOCKS = [
 {id:1, title:"Загальні питання", pts:"п. 1–7", ready:true,
  intro:"Що це за постанова, на що поширюється, ключові терміни, принципи, категорії систем і хто виконує роботи.",
  html:`
<h2>Що це за документ</h2>
<p>Постанова Кабінету Міністрів України (КМУ) від 21.02.2025 № 205 «Деякі питання створення, адміністрування та забезпечення функціонування засобу інформатизації». Чинна з 28.02.2025.</p>
<p>Вона затверджує два документи:</p>
<ul>
<li><b>Обов’язкові вимоги</b> до створення (модернізації, модифікації, розвитку), адміністрування та забезпечення функціонування засобу інформатизації — основний робочий документ;</li>
<li><b>Порядок локалізації програмних продуктів</b> для виконання НПІ (Національної програми інформатизації).</li>
</ul>
<p>Постанову змінювали п’ять разів: № 382 (04.04.2025), № 893 (15.07.2025, нова редакція Обов’язкових вимог), № 1579 (03.12.2025), № 373 (25.03.2026), № 1009 (06.08.2026). Тому працюйте тільки з чинною редакцією.</p>
<div class="box info"><h3>Що скасовано</h3><p>Постанова № 205 скасувала 12 старих актів, зокрема № 121 (1998) про обов’язкові етапи робіт з інформатизації та № 869 (2009) про загальні вимоги до програмних продуктів. Посилання на них у старих документах уже не діють.</p></div>

<h2>На що поширюється <span class="ref">п. 1</span></h2>
<p>На заходи зі створення, адміністрування та підтримки засобів інформатизації, спрямовані на виконання функцій держави або органів місцевого самоврядування.</p>
<p>Не поширюється на:</p>
<ul>
<li>сайти, створені на «Конструкторі веб-сайтів державних органів»;</li>
<li>засоби інформатизації Міноборони (Міністерства оборони) — якщо воно затвердило власні правила життєвого циклу;</li>
<li>заходи за кошти МТД (міжнародної технічної допомоги), якщо замовник сам не вирішив застосовувати вимоги;</li>
<li>засоби СБУ (Служби безпеки України) для оперативно-розшукової, контррозвідувальної та розвідувальної діяльності — за наявності власних правил життєвого циклу.</li>
</ul>

<h2>Ключові терміни <span class="ref">п. 2</span></h2>
<p>У пункті 2 — понад 20 визначень, усі вони є в розділі «Глосарій». Найважливіші для старту:</p>
<ul>
<li><b>Замовник</b> — у значенні Закону «Про Національну програму інформатизації»: установа, якій потрібна система.</li>
<li><b>Технічний адміністратор</b> — юридична особа, що забезпечує супровід, адміністрування і функціонування системи <span class="ref">пп. 15</span>.</li>
<li><b>Координатор робіт</b> — підрозділ або працівник замовника, відповідальний за організацію створення системи <span class="ref">пп. 4</span>.</li>
<li><b>ТВ (технічні вимоги)</b> — планові потреби замовника і загальні умови; набір критеріїв, що описують систему <span class="ref">пп. 14</span>.</li>
<li><b>ТЗ (технічне завдання)</b> — документ, розроблений на основі ТВ: призначення, показники якості, характеристики, опис бізнес-процесів <span class="ref">пп. 13</span>.</li>
<li><b>Життєвий цикл</b> — усі стадії й етапи від ініціювання до виведення з експлуатації <span class="ref">пп. 2</span>.</li>
</ul>

<h2>Десять принципів <span class="ref">п. 3</span></h2>
<p>На них зручно посилатися в обґрунтуваннях і ТЗ:</p>
<ol>
<li>актуальність — сучасні технології;</li>
<li>системність — цілісність і зв’язки компонентів;</li>
<li>розвиток — масштабування й оновлення без втрати функцій;</li>
<li>інтероперабельність — взаємодія з іншими системами, відкриті формати;</li>
<li>ефективність — розумне співвідношення витрат і результату;</li>
<li>уніфікація — типові, стандартизовані рішення;</li>
<li>захищеність — захист інформації та кібербезпека на всіх стадіях;</li>
<li>доступність — рівний доступ для всіх користувачів;</li>
<li>ризик-орієнтованість — з урахуванням оцінки ризиків і категорії (додано № 1009);</li>
<li>стійкість і безперервність — швидке відновлення після збоїв, атак, аварій (додано № 1009).</li>
</ol>

<h2>Категорії систем <span class="ref">п. 3-1, 3-2</span></h2>
<p>Кожен засіб інформатизації отримує категорію I, II або III за результатами BIA (Business Impact Analysis, аналізу впливу порушення безперервності бізнес-процесів). BIA проводять не рідше одного разу на рік і при зміні процесів чи архітектури.</p>
<div class="tablewrap"><table>
<tr><th>Категорія</th><th>Що означає</th><th>RTO, не більше</th><th>RPO, не більше</th></tr>
<tr><td>I</td><td>збій зупиняє критичні процеси, наслідки неприйнятні</td><td>8 год</td><td>4 год</td></tr>
<tr><td>II</td><td>суттєво обмежує важливі процеси, але не зупиняє роботу</td><td>24 год</td><td>12 год</td></tr>
<tr><td>III</td><td>обмежений вплив, невідкладне відновлення не потрібне</td><td>72 год</td><td>24 год</td></tr>
</table></div>
<p>RTO (Recovery Time Objective, цільовий час відновлення) — за скільки система має запрацювати. RPO (Recovery Point Objective, цільова точка відновлення) — скільки даних допустимо втратити. MTPD (Maximum Tolerable Period of Disruption, максимально допустимий період порушення) має бути більшим за RTO, але не більше 1,5 граничного RTO.</p>

<h2>Хто, за чиї кошти і як <span class="ref">п. 4–7</span></h2>
<ul>
<li>Роботи виконує замовник, технічний адміністратор або підрядник, залучений через публічні закупівлі <span class="ref">п. 4</span>.</li>
<li>Фінансування — державний і місцеві бюджети або інші законні джерела <span class="ref">п. 5</span>.</li>
<li>Методологію управління проектами (Scrum, Kanban, Waterfall — каскадну тощо) обирає сам замовник або технічний адміністратор <span class="ref">п. 6</span>.</li>
<li>Можна використовувати програми для управління проектами і вести документацію електронно <span class="ref">п. 7</span>.</li>
</ul>
<div class="box"><h3>Що це означає для тебе</h3><p>Відділ може працювати спринтами і тримати документи в електронному вигляді. Головне — щоб у результаті були всі документи, яких вимагає матриця дій (блок 2). Перш ніж починати будь-яку роботу із системою, з’ясуй її категорію: від неї залежать вимоги до резервування й відновлення.</p></div>
`},
 {id:2, title:"Стадії, матриця дій, перехідні положення", pts:"п. 8–13, дод. 1", ready:true,
  intro:"П’ять стадій життєвого циклу, як читати матрицю дій, що робити зі старими системами, погодження з Мінцифри, договір і технічний адміністратор.",
  html:`
<h2>П’ять стадій життєвого циклу <span class="ref">п. 8</span></h2>
<ol class="steps">
<li><b>Ініціювання</b> — формування потреби, ТВ (технічні вимоги).</li>
<li><b>Проектування</b> — оцінка ризиків, ТЗ (технічне завдання).</li>
<li><b>Створення та впровадження</b> — постачання чи розроблення, випробування, розгортання, захист.</li>
<li><b>Промислова експлуатація</b> — робота в реальних умовах, підтримка, захист.</li>
<li><b>Виведення з промислової експлуатації</b> — припинення, списання, знищення.</li>
</ol>

<h2>Матриця дій <span class="ref">п. 9, дод. 1</span></h2>
<p>Матриця — це «карта обов’язковості». Рядки — етапи стадій. Колонки — тип роботи: створення, модернізація, модифікація, розвиток, адміністрування, забезпечення функціонування. У клітинці одне з чотирьох значень:</p>
<ul>
<li><b>виконується</b> — етап обов’язковий;</li>
<li><b>застосовується</b> — характерний для етапу, з варіаціями;</li>
<li><b>за потреби</b> — якщо цього вимагає проектна документація або нормативи;</li>
<li><b>не застосовується</b> — етап не передбачений.</li>
</ul>
<p>Повна матриця — у розділі <a href="#ref">«Довідник»</a>. Як її читати на практиці:</p>
<ul>
<li><b>Нову систему створюєте</b> — майже всі етапи обов’язкові.</li>
<li><b>Модифікуєте або розвиваєте</b> — більшість етапів «за потреби», документацію можна спростити.</li>
<li><b>Лише адмініструєте</b> — ініціювання і ТЗ не потрібні, а виведення з експлуатації обов’язкове саме тут.</li>
<li><b>Обслуговування й технічна підтримка</b> — обов’язкові для всіх типів робіт.</li>
</ul>
<p>Заходи із захисту інформації та кіберзахисту виконуються <b>на всіх стадіях</b> <span class="ref">п. 9, абз. 2</span>.</p>
<div class="box info"><h3>Гнучкі підходи</h3><p>Якщо команда працює за Agile (гнучкою методологією), етапи можна виконувати ітераційно або паралельно. ТЗ тоді може описувати функції сценаріями використання, критеріями прийнятності та завершеності (виноска **** до дод. 1).</p></div>
<div class="box"><h3>Неузгодженість у тексті</h3><p>У п. 17 оцінка ризиків — етап стадії проектування, а в матриці вона стоїть у рядку ініціювання. Як трактувати у вашій установі, уточніть у керівника.</p></div>

<h2>Старі системи <span class="ref">п. 10</span></h2>
<p>Якщо система існувала до нових вимог, матрицю застосовують з наступного етапу після того, на якому система була на дату набрання чинності постановою № 893. Якщо той етап був останнім у стадії — з наступної стадії.</p>
<p>Додатково з № 1009: перед переходом до наступного етапу чи стадії замовник проводить BIA (аналіз впливу) зі звітом за дод. 1-1 і визначає категорію системи.</p>

<h2>Якщо не вкладаєтесь у граничні значення <span class="ref">п. 10-1, 10-2</span></h2>
<p>Коли RTO, RPO чи MTPD більші за граничні для категорії, їх погоджують з Мінцифри (Міністерством цифрової трансформації):</p>
<ol class="steps">
<li>Лист: чому неможливо дотриматися значень, які компенсуючі заходи, як зміна вплине на процеси. До листа — звіт BIA.</li>
<li>Подання через систему електронної взаємодії органів виконавчої влади або e-mail Мінцифри, з КЕП (кваліфікованим електронним підписом) чи УЕП (удосконаленим електронним підписом) керівника.</li>
<li>Мінцифри відповідає протягом 15 робочих днів.</li>
<li>Підстави для відмови: неповні документи; значення не збігаються з результатами BIA; недостатні компенсуючі заходи.</li>
<li>Після відмови — доопрацювання і повторне звернення протягом 10 календарних днів.</li>
</ol>

<h2>Що має бути в договорі <span class="ref">п. 11</span></h2>
<p>У договорі з підрядником на створення чи розвиток системи визначають:</p>
<ol>
<li>етапи робіт чи послуг;</li>
<li>умови використання засобу, переданого на модернізацію;</li>
<li>вимоги до якості — за ТВ та/або ТЗ;</li>
<li>гарантійний строк і умови гарантії;</li>
<li>умови використання створеного засобу як об’єкта інтелектуальної власності;</li>
<li>передання майнових прав інтелектуальної власності;</li>
<li>порядок впровадження;</li>
<li>умови технічної підтримки;</li>
<li>вимоги до інформаційної безпеки та кіберзахисту (додано № 1009).</li>
</ol>
<p>Обов’язкові додатки до договору: ТВ або технічна специфікація предмета закупівлі, календарний план, розрахунок вартості.</p>

<h2>Інформація з обмеженим доступом <span class="ref">п. 12</span></h2>
<p>Якщо система обробляє службову інформацію чи державну таємницю, діють закони «Про доступ до публічної інформації», «Про державну таємницю», постанови № 939 і № 736. Обов’язкова експертна оцінка інформації, яка оброблятиметься.</p>

<h2>Технічний адміністратор <span class="ref">п. 13</span></h2>

<h2>Етапи стадії <span class="ref">п. 19</span></h2>
<ol class="steps">
<li><b>Постачання та/або створення</b> ПЗ і технічних засобів.</li>
<li><b>Попередні випробування.</b></li>
<li><b>Розгортання.</b></li>
<li><b>Дослідна експлуатація</b> — у разі потреби.</li>
</ol>
<p>У матриці дій окремим рядком цієї стадії йде впровадження СЗІ (системи захисту інформації). За потреби затверджують положення про засіб інформатизації <span class="ref">п. 20</span>.</p>

<h2>Вихідний код <span class="ref">п. 21</span></h2>
<ul>
<li>Засіб-ПЗ передають з виконуваним кодом та/або виконуваними файлами, та/або вихідним кодом та іншими даними, потрібними для запуску.</li>
<li>Опис вихідного коду роблять <b>коментарями в самому коді</b>.</li>
<li>Код і опис <b>не передають</b>, якщо: це заборонено правочинами щодо майнових прав інтелектуальної власності; використано компоненти з відкритим кодом — крім випадків, коли відкритий код узято за основу продукту.</li>
<li>Поставка готового ПЗ, техніки чи мережевого обладнання не включає стадію проектування.</li>
</ul>

<h2>Договір поставки <span class="ref">п. 22</span></h2>
<ol>
<li>Комплектність за специфікацією.</li>
<li>Передання майнових прав інтелектуальної власності або дозвіл (ліцензія) на використання.</li>
<li>Встановлення на об’єкті (за потреби).</li>
<li>Гарантійні зобов’язання.</li>
<li>Строки та умови технічної підтримки.</li>
</ol>
<div class="box"><h3>Заборона</h3><p>Не можна купувати засіб, ліцензія якого передбачає роялті або винагороду правовласнику у вигляді відсотків від плати за послуги, що надаються від імені держави.</p></div>

<h2>Попередні випробування <span class="ref">п. 23</span></h2>
<ul>
<li>Проводять у середовищі, визначеному в ТВ.</li>
<li>Перевіряють відповідність проектній та експлуатаційній документації, працездатність — за програмою та методикою випробувань, і готовність до експлуатації (або повертають на доопрацювання).</li>
<li>Учасників, склад робіт, типи й послідовність випробувань погоджують із замовником і технічним адміністратором; їхні представники обов’язково беруть участь.</li>
<li>Результат — <b>протокол випробувань</b>.</li>
</ul>

<h2>Розгортання <span class="ref">п. 24–25</span></h2>
<p>Місце: об’єкт замовника, інфраструктура технічного адміністратора, хмара чи ЦОД. Може включати встановлення у випробувальному або промисловому середовищі, навчання фахівців і приймальні випробування. Встановлення передбачає перевірку в умовах, наближених до реальних, відпрацювання технології, аналіз роботи і міграцію даних — з документуванням результатів.</p>

<h2>Приймальні випробування <span class="ref">п. 26</span></h2>
<ul>
<li>Комісія — розпорядчим документом замовника (за потреби).</li>
<li>Оцінка за програмою і методикою приймальних випробувань.</li>
<li>Для модернізованого засобу — оцінка відповідності вимогам захисту інформації.</li>
<li>Протокол із висновками та рекомендаціями щодо введення в експлуатацію.</li>
<li>Приймання майнових прав інтелектуальної власності.</li>
</ul>
<p>Після цього замовник ухвалює рішення: промислова чи дослідна експлуатація.</p>

<h2>Безперервність функціонування <span class="ref">п. 26-1–26-7</span></h2>
<p>Ці пункти додала постанова № 1009. Вони визначають, що треба підготувати ще до промислової експлуатації.</p>
<h3>Система захисту інформації <span class="ref">п. 26-1</span></h3>
<p>СЗІ — організаційні й технічні заходи захисту відповідно до цільового профілю безпеки.</p>
<h3>Відновлювальний резерв</h3>
<p>Це не просто бекап, а резервні копії плюс заздалегідь підготовлені технічні, програмні, інфраструктурні, хмарні, мережеві та організаційні ресурси, що дають змогу відновити систему в межах RTO і RPO. Охоплює дані, ПЗ, конфігурації, засоби захисту, документацію.</p>
<ul>
<li>Відокремлений від основного середовища.</li>
<li>Захищений.</li>
<li>Придатний для тестування без зупинки основної системи.</li>
</ul>
<h3>Географічне рознесення (I і II категорії)</h3>
<ul>
<li>Основне й резервне середовища мають бути географічно відокремлені з урахуванням природних, техногенних і воєнних загроз.</li>
<li>Основне середовище в Україні → щонайменше один резерв <b>за кордоном</b> у захищеному середовищі.</li>
<li>Основне середовище за кордоном → щонайменше один резерв <b>в українській юрисдикції</b>.</li>
</ul>
<h3>Захист резервних копій</h3>
<ul>
<li>Неможливість одноосібно видалити копію, змінити її чи скоротити строк зберігання (принцип «двох ключів», незмінні копії — immutable backup).</li>
<li>Мінімальний строк зберігання копії — <b>48 годин</b> з моменту створення <span class="ref">п. 26-6</span>.</li>
<li>Для окремих систем I–II категорій — передавання копій до Національного центру резервування державних інформаційних ресурсів. Це не звільняє від власного резерву; копії зараховуються, лише якщо підтверджено відновлення в межах MTPD, RTO і RPO.</li>
</ul>
<h3>План аварійного відновлення <span class="ref">п. 26-7</span></h3>
<p>Документ, що визначає:</p>
<ol>
<li>підстави і порядок введення плану в дію;</li>
<li>послідовність і пріоритети відновлення;</li>
<li>відповідальних;</li>
<li>взаємодію команд;</li>
<li>порядок повернення до штатного режиму.</li>
</ol>
<div class="box info"><h3>Номери підпунктів</h3><p>Тут указано номери лише тих підпунктів 26-1–26-7, які точно відомі. Перш ніж посилатися на конкретний підпункт у документах, звірте його з чинною редакцією.</p></div>

<div class="box"><h3>Що з’ясувати у своєму відділі</h3><ul><li>Де фізично лежать резервні копії і чи є копія за межами України (або в Україні — якщо основне середовище за кордоном)?</li><li>Чи захищені копії від одноосібного видалення?</li><li>Чи є затверджений план аварійного відновлення?</li></ul></div>
`},

<h2>Три етапи стадії <span class="ref">п. 28</span></h2>
<ol class="steps">
<li><b>Введення в промислову експлуатацію.</b></li>
<li><b>Обслуговування й технічна підтримка.</b></li>
<li><b>Забезпечення захисту інформації.</b></li>
</ol>
<p>За матрицею дій обслуговування й технічна підтримка обов’язкові для всіх шести типів робіт, а захист інформації «застосовується» у всіх шести.</p>

<h2>Введення та обслуговування <span class="ref">п. 29–30</span></h2>
<ul>
<li>Систему вводять у промислову експлуатацію <b>розпорядчим документом</b> замовника або технічного адміністратора.</li>

</ul>

<h2>Адміністрування чи забезпечення функціонування <span class="ref">п. 31</span></h2>
<div class="tablewrap"><table>
<tr><th>Адміністрування</th><th>Забезпечення функціонування</th></tr>
<tr><td>Керованість системою і її доступність для користувачів: управління доступом, системами, безпекою, даними; моніторинг дій</td><td>Працездатний стан: встановлення, налаштування, оновлення, відновлення; визначення потреби в модернізації або виведенні</td></tr>
</table></div>

<h2>Договір на адміністрування <span class="ref">п. 32</span></h2>
<p>У договорі на адміністрування чи забезпечення функціонування визначають якість послуг відповідно до ТВ, строки й порядок надання, перелік обставин для робіт на вимогу.</p>
<p>Обов’язкові додатки: ТВ або технічна специфікація, розрахунок вартості, <b>форма звіту про фактично надані послуги</b>.</p>

<h2>Моніторинг і аудит</h2>
<p>Моніторинг проводять у межах внутрішнього контролю або аудиту використання ІТ. Завдання — оцінити працездатність, надійність, безпеку, використання ресурсів і продуктивність. Результат аудиту — звіт із рекомендаціями: модернізувати систему чи виводити її з експлуатації.</p>

<h2>Інтернет і Wi-Fi <span class="ref">п. 33, дод. 5</span></h2>

<tr><th>Вимога</th><th>Значення</th></tr>

<ul>
<li>Різні кабелі до різних вузлів провайдера; xPON / FTTx без проміжних активних елементів.</li>
<li>Статична публічна IP-адреса і цілодобовий моніторинг.</li>

<h2>Тестування відновлення <span class="ref">п. 33-1, дод. 6</span></h2>
<p>Для систем I і II категорій сценарії, періодичність, критерії успішності й документування тестування визначають у ТЗ (блок 4).</p>
<ul>
<li><b>Що перевіряють:</b> резервні копії, компоненти, відновлювальний резерв, інтеграції з іншими системами, бізнес-процеси — зокрема full failover (комплексне переключення всіх взаємопов’язаних компонентів на резерв).</li>
<li><b>Як часто:</b> не рідше 1 разу на 6 місяців, а також після істотних змін архітектури, місця розгортання, резервування чи процедур <span class="ref">дод. 6, п. 6</span>.</li>
<li>Результати документують.</li>
</ul>

<h2>Порядок локалізації програмних продуктів</h2>
<p>Другий документ, затверджений постановою № 205. Локалізація — приведення ПЗ у відповідність із законодавством, нормами й правилами.</p>

 ["Інформація про локалізований продукт генеральному замовнику","щороку до 1 березня","Порядок локалізації, п. 11"],
 ["BIA для міністерств, ЦОВВ (центральних органів виконавчої влади), ОДА","2 місяці з дня чинності № 1009 (до 13.10.2026)","пост. № 1009, п. 2"]
];

/* ===================== СТАН ===================== */
const KEY = "pkmu205_progress_v1";
let mem = null;
function load(){
  const def = {read:{},quiz:{},cards:{},theme:"auto"};
  try{ const s = localStorage.getItem(KEY); return s ? Object.assign(def, JSON.parse(s)) : def; }
  catch(e){ return mem || def; }
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ mem = S; } }

const DAY = 86400000;
const BOXES = [0,1,3,7,14,30];
function cardKey(b,i){ return b+"-"+i; }
function grade(b,i,ok){
  const k = cardKey(b,i), c = S.cards[k] || {box:0,due:0};
  c.box = ok ? Math.min(c.box+1, BOXES.length-1) : 1;
  c.due = Date.now() + BOXES[c.box]*DAY;
  S.cards[k] = c;
}
function dueCards(){
  const now = Date.now(), out = [];
  for(const k in S.cards){ if(S.cards[k].due <= now){ const [b,i] = k.split("-").map(Number); if(QUIZ[b] && QUIZ[b][i]) out.push([b,i]); } }
  return out;
}
function blockState(id){
  const r = !!S.read[id], q = S.quiz[id], total = QUIZ[id] ? QUIZ[id].length : 0;
  const passed = q && total && q.best/total >= 0.8;
  return {read:r, best:q?q.best:null, total, passed, done:r && passed};
}

/* ===================== УТИЛІТИ ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),1800); }
function strip(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); }

const ICONS = {
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>',
 ref:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 gl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'
};
function renderNav(route){
  const due = dueCards().length;
  let h = `<h4>Уроки</h4>`;
  for(const b of BLOCKS){
    const st = blockState(b.id);
    const dot = !b.ready ? "" : st.done ? "full" : (st.read||st.best!==null) ? "half" : "";
    h += `<a href="#block-${b.id}" class="${route==="block-"+b.id||route==="quiz-"+b.id?"on":""} ${b.ready?"":"off"}"><span class="dot ${dot}"></span>${b.id}. ${esc(b.title)}</a>`;
  }
  h += `<h4>Інструменти</h4>
  <a href="#review" class="${route==="review"?"on":""}">Повторення${due?` <span class="pill mid">${due}</span>`:""}</a>

  <a href="#glossary" class="${route==="glossary"?"on":""}">Глосарій</a>
  <a href="#templates" class="${route==="templates"?"on":""}">Шаблони документів</a>
  <a href="#progress" class="${route==="progress"?"on":""}">Мій прогрес</a>`;
  $("#side").innerHTML = h;
  const items = [["home","Уроки",ICONS.home],["review","Повторення",ICONS.review],["ref","Довідник",ICONS.ref],["glossary","Глосарій",ICONS.gl],["progress","Ще",ICONS.more]];
  const isLesson = route==="home"||/^(block|quiz)-/.test(route);
  $("#bottom").innerHTML = items.map(([r,t,i]) => `<a href="#${r}" class="${(r==="home"&&isLesson)||r===route||(r==="progress"&&route==="templates")?"on":""}">${i}${t}</a>`).join("");

function viewHome(){

  let list = BLOCKS.map(b => {
    const st = blockState(b.id);
    let pill = !b.ready ? `<span class="pill">Готується</span>` : st.done ? `<span class="pill ok">Пройдено</span>` : st.best!==null ? `<span class="pill mid">Тест ${st.best}/${st.total}</span>` : st.read ? `<span class="pill mid">Прочитано</span>` : `<span class="pill">Не розпочато</span>`;
    return `<li><a class="blk ${b.ready?"":"locked"}" href="#block-${b.id}"><span class="n">${b.id}</span><span><span class="t">${esc(b.title)}</span><br><span class="s">${esc(b.pts)}</span></span>${pill}</a></li>`;
  }).join("");
  return `<h1>Життєвий цикл державної ІТ-системи</h1>

  <h2>Уроки</h2>
  <p class="s" style="color:var(--muted)">Урок вважається пройденим, коли його прочитано і тест складено щонайменше на 80 %.</p>

function viewBlock(id){
  const b = BLOCKS.find(x=>x.id===id);

    ${next?`<a class="btn" href="#block-${next.id}">Наступний урок</a>`:""}

}

let QS = null;
function startQuiz(id, list){
  QS = {id, list: list || QUIZ[id].map((_,i)=>[id,i]), pos:0, score:0, answered:false};
}
function viewQuiz(){
  if(!QS) return viewHome();
  const isReview = QS.id==="review";
  if(QS.pos >= QS.list.length){
    if(!isReview){
      const prev = S.quiz[QS.id];
      S.quiz[QS.id] = {best: Math.max(prev?prev.best:0, QS.score), last: QS.score, date: Date.now()};
      save();
    }
    const tot = QS.list.length, pct = Math.round(QS.score/tot*100);
    const passed = pct >= 80;
    return `<div class="quiz"><h1>${isReview?"Повторення завершено":"Результат тесту"}</h1>
    <p class="q">${QS.score} з ${tot} (${pct} %)</p>
    <div class="fb ${passed?"ok":"no"}">${passed?"Добре. Питання, на які ви відповіли правильно, повернуться для повторення пізніше, щоб закріпити знання.":"Перечитайте урок і спробуйте ще раз. Питання з помилками з’являться в розділі «Повторення» завтра."}</div>
    <div class="btns">${isReview?`<a class="btn primary" href="#home">До уроків</a>`:`<a class="btn" href="#block-${QS.id}">Повернутися до уроку</a><button class="btn primary" id="retry" type="button">Пройти ще раз</button>`}</div></div>`;
  }
  const [b,i] = QS.list[QS.pos], it = QUIZ[b][i];
  const pct = Math.round(QS.pos/QS.list.length*100);
  return `<div class="quiz">
  <p class="qmeta">${isReview?"Повторення":"Тест до блоку "+b} · питання ${QS.pos+1} з ${QS.list.length}</p>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <p class="q">${esc(it.q)}</p>
  <div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}" type="button">${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div></div>`;
}
function answer(k){
  if(!QS || QS.answered) return;
  QS.answered = true;
  const [b,i] = QS.list[QS.pos], it = QUIZ[b][i], ok = k===it.a;
  if(ok) QS.score++;
  grade(b,i,ok); save();
  document.querySelectorAll(".opt").forEach(el=>{
    const kk = +el.dataset.k; el.disabled = true;
    if(kk===it.a) el.classList.add("right"); else if(kk===k) el.classList.add("wrong");
  });
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${ok?"Правильно.":"Неправильно."}</b> ${esc(it.e)} <span class="ref">${esc(it.r)}</span></div>
  <div class="btns"><button class="btn primary" id="nextQ" type="button">${QS.pos+1<QS.list.length?"Наступне питання":"Показати результат"}</button></div>`;
  $("#nextQ").focus();
}

function viewReview(){
  const due = dueCards();
  const learned = Object.keys(S.cards).length;
  if(!learned) return `<h1>Повторення</h1><p>Тут з’являтимуться питання з пройдених тестів через зростаючі проміжки: 1, 3, 7, 14 і 30 днів. Питання з помилками повертаються наступного ж дня.</p><div class="btns"><a class="btn primary" href="#block-1">Почати з блоку 1</a></div>`;
  if(!due.length){
    const next = Math.min(...Object.values(S.cards).map(c=>c.due));
    const d = new Date(next);
    return `<h1>Повторення</h1><p>На сьогодні все повторено. Наступні питання з’являться ${d.toLocaleDateString("uk-UA")}.</p><p class="qmeta">Питань у системі повторення: ${learned}</p>`;
  }
  return `<h1>Повторення</h1><p>Сьогодні на повторення: <b>${due.length}</b> ${due.length===1?"питання":"питань"}.</p><div class="btns"><button class="btn primary" id="startReview" type="button">Почати повторення</button></div>`;
}

function glList(f){
  const ff = f.toLowerCase();

  return items.map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])} <span class="ref">${esc(g[2])}</span></dd>`).join("");
}

/* ===================== ПОШУК ===================== */
let INDEX = null;
function buildIndex(){
  INDEX = [];
  for(const b of BLOCKS){
    if(!b.ready){ INDEX.push({t:`Блок ${b.id}. ${b.title}`, x:b.intro+" "+b.pts, r:"block-"+b.id}); continue; }
    const parts = b.html.split(/<h2>/).slice(1);
    for(const p of parts){
      const head = strip(p.split("</h2>")[0]);
      INDEX.push({t:`Блок ${b.id}: ${head}`, x:strip(p), r:"block-"+b.id});
    }
  }
  for(const g of GLOSSARY) INDEX.push({t:"Глосарій: "+g[0], x:g[1]+" "+g[2], r:"glossary"});
  for(const s of STRUCTURE) INDEX.push({t:"Структура: "+s[0], x:s[1], r:"ref"});
  for(const d of DEADLINES) INDEX.push({t:"Строки: "+d[0], x:d[1]+" "+d[2], r:"ref"});
  for(const r of MATRIX.rows) INDEX.push({t:"Матриця дій: "+(r[0]?r[0]+", ":"")+r[1], x:"дод. 1 матриця", r:"ref"});
}
function viewSearch(q){
  if(!INDEX) buildIndex();
  const words = q.toLowerCase().split(/\s+/).filter(w=>w.length>1);
  if(!words.length) return `<h1>Пошук</h1><p>Введіть щонайменше два символи.</p>`;
  const res = INDEX.filter(it => { const hay=(it.t+" "+it.x).toLowerCase(); return words.every(w=>hay.includes(w)); }).slice(0,40);
  const hl = s => { let o=esc(s); for(const w of words){ o=o.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>"); } return o; };
  const snip = x => { const lx=x.toLowerCase(), p=Math.max(0, lx.indexOf(words[0])-60); return (p>0?"…":"")+x.slice(p,p+180)+(x.length>p+180?"…":""); };
  return `<h1>Пошук: «${esc(q)}»</h1>
  ${res.length?`<ul class="res">${res.map(it=>`<li><a href="#${it.r}">${hl(it.t)}</a><small>${hl(snip(it.x))}</small></li>`).join("")}</ul>`:`<p>Нічого не знайдено. Спробуйте коротше слово або номер пункту, наприклад «26-6».</p>`}`;
}

/* ===================== РОУТЕР ===================== */
function route(){
  const h = location.hash.replace(/^#/,"") || "home";
  let html, r = h;
  if(h.startsWith("block-")) html = viewBlock(+h.slice(6));
  else if(h.startsWith("quiz-")){ const id=+h.slice(5); if(!QUIZ[id]){ html=viewHome(); r="home"; } else { if(!QS||QS.id!==id) startQuiz(id); html=viewQuiz(); } }
  else if(h==="review-run"){ html = viewQuiz(); r="review"; }
  else if(h==="review") html = viewReview();
  else if(h==="ref") html = viewRef();
  else if(h==="glossary") html = viewGlossary();
  else if(h==="templates") html = viewTemplates();
  else if(h==="progress") html = viewProgress();
  else if(h==="search") html = viewSearch($("#q").value);
  else { html = viewHome(); r="home"; }
  if(!h.startsWith("quiz-") && h!=="review-run") QS = null;
  $("#main").innerHTML = html;
  renderNav(r);
  if(!route.keep) window.scrollTo(0,0);
  route.keep = false;
}
function rerender(){ route.keep = true; const h=location.hash; route(); }

document.addEventListener("click", e => {
  const t = e.target.closest("button,.opt");
  if(!t) return;
  if(t.classList.contains("opt")) return answer(+t.dataset.k);
  if(t.id==="nextQ"){ QS.pos++; QS.answered=false; $("#main").innerHTML=viewQuiz(); renderNav(QS.id==="review"?"review":"quiz-"+QS.id); window.scrollTo(0,0); return; }
  if(t.id==="retry"){ startQuiz(QS.id); $("#main").innerHTML=viewQuiz(); window.scrollTo(0,0); return; }
  if(t.id==="markRead"){ const id=+location.hash.slice(7); S.read[id]=true; save(); toast("Урок позначено прочитаним"); rerender(); return; }
  if(t.id==="startReview"){ const d=dueCards(); for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];} QS={id:"review",list:d.slice(0,20),pos:0,score:0,answered:false}; location.hash="review-run"; return; }
  if(t.id==="exp"){ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="progres-205-1009.json"; document.body.appendChild(a); a.click(); a.remove(); toast("Файл прогресу збережено"); return; }
  if(t.id==="reset"){ if(confirm("Скинути весь прогрес? Цю дію не можна скасувати.")){ S={read:{},quiz:{},cards:{},theme:S.theme}; save(); toast("Прогрес скинуто"); rerender(); } return; }
  if(t.id==="themeBtn"){ S.theme = {auto:"light",light:"dark",dark:"auto"}[S.theme]||"auto"; save(); applyTheme(); return; }
});
document.addEventListener("change", e => {
  if(e.target.id==="imp" && e.target.files[0]){
    const fr = new FileReader();
    fr.onload = () => { try{ const d=JSON.parse(fr.result); if(!d.read||!d.quiz||!d.cards) throw 0; S=Object.assign({read:{},quiz:{},cards:{},theme:"auto"},d); save(); applyTheme(); toast("Прогрес завантажено"); rerender(); }catch(err){ toast("Це не файл прогресу цього інструмента"); } };
    fr.readAsText(e.target.files[0]);
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="gf") $("#gl").innerHTML = glList(e.target.value);
});
$("#q").addEventListener("keydown", e => { if(e.key==="Enter"){ if(location.hash==="#search") rerender(); else location.hash="search"; } });
$("#q").addEventListener("input", () => { if(location.hash==="#search") rerender(); });

function applyTheme(){
  const r = document.documentElement;
  if(S.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  $("#themeBtn").innerHTML = "◐<span class=\"lbl\"> Тема: " + ({auto:"авто",light:"світла",dark:"темна"}[S.theme]||"авто") + "</span>";
}
window.addEventListener("hashchange", route);
applyTheme();
route();
</script>
</body>
</html>
